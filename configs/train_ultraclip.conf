dataset {
    modality = "us"  # us | mri | ct
    data_path = "data/ultrasound_data"
    image_folder = ""
    lazy_preprocess = True
    is_multimodal = True
    image_aspect_ratio = square
    image_grid_pinpoints = None
    max_seq_length = 248
    base_seq_length = 77
    base_image_size = 512  # us: 512, mri/ct: 336
    add_box_loss = True
    use_hard_neg = True
    spatial = True
}

dataloader {
    num_workers = 8
    batch_size = 16
}

model {
    base_model = "qihoo360/fg-clip-base"
    model_name_or_path = "qihoo360/fg-clip-base"
    add_box_loss = True
    use_hard_neg = True
    nl_semantic_supervision = True
    use_vfm = True
    attention_mask = None
    position_ids = None
    return_loss = None
    output_attentions = None
    output_hidden_states = None
    return_dict = None
    local_loss = False
    gather_with_grad = False
    cache_labels = True
    rank = 0
    world_size = 1
    use_horovod = False
    alpha = 1.0
    beta = 0.5
    separate_text = True
    separate_image = True
    horovod = False
}

train {
    random_seed = 33
    max_epochs = 16
    strategy = ddp
    checkpoint_dir = "checkpoint/ultraclip_us"
    save_epoch_freq = 2
    accelerator = "gpu"
    precision = "16-mixed"
}
